[package]
name = "dynark-solana-adapter"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
ark-bn254 = "=0.5.0"
ark-ec = "=0.5.0"
ark-ff = "=0.5.0"
ark-serialize = "=0.5.0"
ordinary = { package = "ark-groth16", version = "=0.5.0" }
groth16-solana = "=0.2.0"
sha2 = "=0.10.9"

[dev-dependencies]
dynark-bn254 = { path = "../dynark-bn254" }
dynark = { package = "ark-groth16", path = "../dynark-bn254/vendor/ark-groth16" }
ark-relations = "=0.5.1"
rand = "=0.8.8"
libc = "=0.2.190"
serde_json = "=1.0.151"
zk-fresh-program = { path = "../../program", features = ["no-entrypoint"] }

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
