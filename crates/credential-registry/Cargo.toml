[package]
name = "credential-registry"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
ark-bn254 = "=0.5.0"
light-poseidon = "=0.4.0"
openssl = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
rustix = { version = "=1.1.5", default-features = false, features = ["std", "fs"] }

[dev-dependencies]
tempfile = "3"

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
