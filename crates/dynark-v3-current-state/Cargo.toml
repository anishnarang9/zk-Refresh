[package]
name = "dynark-v3-current-state"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
credential-registry = { path = "../credential-registry" }
zk-fresh-program = { path = "../../program", features = ["no-entrypoint"] }
solana-program = "=2.3.0"
sha2 = "0.10"
bincode = "=1.3.3"
serde_json = "=1.0.152"
serde = "=1.0.229"
base64 = "=0.22.1"
bs58 = "=0.5.1"
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking"] }

[dev-dependencies]
# Already a production dependency of credential-registry; used only to sign test envelopes.
openssl = "0.10"

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
