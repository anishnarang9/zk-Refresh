[package]
name = "dynark-native-client"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
dynark-bn254 = { path = "../dynark-bn254" }
dynark-v3-current-state = { path = "../dynark-v3-current-state" }
credential-registry = { path = "../credential-registry" }
ark-bn254 = "=0.5.0"
ark-ff = "=0.5.0"
ark-serialize = "=0.5.0"
ordinary = { package = "ark-groth16", version = "=0.5.0" }
rand = "=0.8.8"
sha2 = "=0.10.9"

[dev-dependencies]
openssl = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
