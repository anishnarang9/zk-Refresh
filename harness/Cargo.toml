[package]
name = "zk-fresh-benchmark"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
openssl = "0.10"
chrono = "0.4"
sha2 = "0.10"
blake2 = "0.10"
num-bigint = "0.4"
light-poseidon = "=0.4.0"
ark-bn254 = "=0.5.0"
ark-ff = "=0.5.0"
hex = "0.4"
solana-sdk = "=2.3.1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
base64 = "0.22"
bincode = "1.3"
libc = "0.2"
rand = "0.8"
zk-fresh-program = { path = "../program", features = ["no-entrypoint"] }
credential-registry = { path = "../crates/credential-registry" }

[dev-dependencies]
tempfile = "3"
